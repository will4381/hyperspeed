<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pulse{45%{opacity:.15}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pulse,.ic-trigger:hover .ic .ic-a-pulse{animation-name:ic-pulse}</style><mask id="ic-cpu-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-pulse"><path d="M9.5 3v3M14.5 3v3" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.1s"><path d="M18 9.5h3M18 14.5h3" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.2s"><path d="M9.5 18v3M14.5 18v3" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.3s"><path d="M3 9.5h3M3 14.5h3" stroke="#fff"/></g><path d="M9 6h6a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3Z" stroke="#fff"/><path d="M10.75 9.75h2.5a1 1 0 0 1 1 1v2.5a1 1 0 0 1-1 1h-2.5a1 1 0 0 1-1-1v-2.5a1 1 0 0 1 1-1Z" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-cpu-line)"/></svg>
