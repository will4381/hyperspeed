[package]
name = "hyperspeed"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
muda = "0.21.2"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
tao = "0.37.2"
wry = "0.57.1"

[profile.release]
lto = "thin"
strip = true
